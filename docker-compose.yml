services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pitchkiln
      POSTGRES_USER: pitchkiln
      POSTGRES_PASSWORD: pitchkiln
    ports:
      - "6670:5432"
    volumes:
      - pitchkiln_bug08_pg:/var/lib/postgresql/data
    # 首次 initdb 时频繁 healthcheck 会卡住临时库关停，故改为仅等容器启动
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U pitchkiln -d pitchkiln"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 36
    #   start_period: 90s

  web:
    build: .
    ports:
      - "5270:4710"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: pitchkiln
      POSTGRES_USER: pitchkiln
      POSTGRES_PASSWORD: pitchkiln
      CSRF_TRUSTED_ORIGINS: "http://localhost:5270,http://127.0.0.1:5270"
      USE_GUNICORN: "1"
    depends_on:
      - db

volumes:
  pitchkiln_bug08_pg:
